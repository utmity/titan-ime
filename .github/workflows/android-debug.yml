name: Android debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare CI version code and restore signing key
        shell: bash
        env:
          TITAN_KEYSTORE_BASE64: ${{ secrets.TITAN_KEYSTORE_BASE64 }}
        run: |
          echo "TITAN_VERSION_CODE=$((10000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          if [ -n "$TITAN_KEYSTORE_BASE64" ]; then
            echo "$TITAN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/titan-ime-ci.keystore"
            echo "TITAN_KEYSTORE_FILE=$RUNNER_TEMP/titan-ime-ci.keystore" >> "$GITHUB_ENV"
            echo "Stable CI signing key restored from repository secrets."
          else
            echo "::warning::TITAN_KEYSTORE_BASE64 is not set. This build falls back to the ephemeral per-runner debug key, so its APKs cannot update an existing install. See docs/apk-signing.md."
          fi
      - name: Build debug APK
        env:
          TITAN_KEYSTORE_PASSWORD: ${{ secrets.TITAN_KEYSTORE_PASSWORD }}
          TITAN_KEY_ALIAS: ${{ secrets.TITAN_KEY_ALIAS }}
          TITAN_KEY_PASSWORD: ${{ secrets.TITAN_KEY_PASSWORD }}
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: titan-ime-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
