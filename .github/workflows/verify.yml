name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Prepare CI version code and restore signing key
        shell: bash
        env:
          TITAN_KEYSTORE_BASE64: ${{ secrets.TITAN_KEYSTORE_BASE64 }}
        run: |
          # Monotonic across runs of this workflow, so a newer CI APK never
          # looks like a downgrade; the base stays above the pinned dev code.
          echo "TITAN_VERSION_CODE=$((10000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          if [ -n "$TITAN_KEYSTORE_BASE64" ]; then
            echo "$TITAN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/titan-ime-ci.keystore"
            echo "TITAN_KEYSTORE_FILE=$RUNNER_TEMP/titan-ime-ci.keystore" >> "$GITHUB_ENV"
            echo "Stable CI signing key restored from repository secrets."
          else
            echo "::warning::TITAN_KEYSTORE_BASE64 is not set. This build falls back to the ephemeral per-runner debug key, so its APKs cannot update an existing install. See docs/apk-signing.md."
          fi
      - name: Install required Android SDK packages
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-35 platforms;android-36 build-tools;34.0.0'
      - name: Restore pinned Mozc build
        id: mozc-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .local/mozc-dist
          key: mozc-arm64-${{ runner.os }}-${{ hashFiles('scripts/build-mozc.sh') }}
      - name: Build Mozc on Linux
        if: steps.mozc-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-mozc.sh
      - name: Package engine and dictionary
        shell: pwsh
        run: ./scripts/import-mozc.ps1 -Source .local/mozc-dist
      - name: Verify and build (no device connected)
        env:
          # Key passwords reach only this Gradle step, never the job env.
          TITAN_KEYSTORE_PASSWORD: ${{ secrets.TITAN_KEYSTORE_PASSWORD }}
          TITAN_KEY_ALIAS: ${{ secrets.TITAN_KEY_ALIAS }}
          TITAN_KEY_PASSWORD: ${{ secrets.TITAN_KEY_PASSWORD }}
        run: >-
          bash gradlew --no-daemon --console=plain
          :app:testDebugUnitTest :app:lintDebug :harness:lintDebug
          :app:assembleDebug :app:assembleRelease :app:assemblePreview
          :app:assembleDebugAndroidTest
          :harness:assembleDebug :harness:assembleDebugAndroidTest
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
            harness/build/reports/
          retention-days: 7
      - name: Verify install APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" > /tmp/titan-ime-badging.txt
          grep -F "name='dev.utmity.titanime'" /tmp/titan-ime-badging.txt
          grep -F "versionName='0.1.1-pr2'" /tmp/titan-ime-badging.txt
          VC=$(sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p" /tmp/titan-ime-badging.txt | head -1)
          test -n "$VC"
          echo "Install APK versionCode: $VC"
          mkdir -p dist
          cp "$APK" "dist/Titan-IME-0.1.1-pr2-build${VC}.apk"
      - name: Save clearly named install APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: titan-ime-pr2-install-only
          path: dist/Titan-IME-0.1.1-pr2-build*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Verify separately installable preview identity
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/preview/app-preview.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" > /tmp/titan-preview-badging.txt
          grep -F "name='dev.utmity.titanime.preview'" /tmp/titan-preview-badging.txt
          grep -F "versionName='0.1.1-pr2-preview'" /tmp/titan-preview-badging.txt
          grep -F "application-label:'Titan IME Preview'" /tmp/titan-preview-badging.txt
          mkdir -p dist
          cp "$APK" dist/Titan-IME-Preview-0.1.1-pr2.apk
      - name: Save preview APK without replacing existing IME
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: titan-ime-preview-safe-install
          path: dist/Titan-IME-Preview-0.1.1-pr2.apk
          if-no-files-found: error
          retention-days: 7
      - name: Save device-test APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-device-test-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            harness/build/outputs/apk/debug/*.apk
            harness/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 7
  runner-cleanup:
    name: Windows runner cleanup regression (mock ADB)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check restoration after simulated failures
        shell: pwsh
        run: ./scripts/test-runner-cleanup.ps1
