name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build, unit tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install required Android SDK packages
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - name: Verify and build (no device connected)
        run: >-
          bash gradlew --no-daemon --console=plain
          :app:testDebugUnitTest :app:lintDebug :harness:lintDebug
          :app:assembleDebug :app:assembleRelease
          :harness:assembleDebug :harness:assembleDebugAndroidTest
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
            harness/build/reports/
          retention-days: 7
      - name: Save device-test APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-device-test-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            harness/build/outputs/apk/debug/*.apk
            harness/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 7
  runner-cleanup:
    name: Windows runner cleanup regression (mock ADB)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check restoration after simulated failures
        shell: pwsh
        run: ./scripts/test-runner-cleanup.ps1
